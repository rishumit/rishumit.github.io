  <style>
    :root { --bg: #fbfaf6; --ink: #0f1f1a; --muted: #4b5a54; --leaf: #2f6b52; --leaf-ink: #fff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0a1512; --ink: #f0f6f2; --muted: #a9b8b1; --leaf: #8fc2a6; --leaf-ink: #0a1512; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--ink);
      font-family: "Segoe UI", Arial, "Noto Sans Hebrew", sans-serif; line-height: 1.6;
      padding: 24px 16px;
    }
    main { max-width: 34rem; text-align: center; }
    img { width: 88px; height: 88px; }
    h1 { font-size: clamp(2rem, 1.5rem + 2.5vw, 3rem); margin: .5rem 0 .25rem; line-height: 1.2; }
    p { color: var(--muted); font-size: 1.15rem; margin: .5rem 0 1.75rem; }
    a.btn {
      display: inline-block; background: var(--leaf); color: var(--leaf-ink);
      text-decoration: none; font-weight: 700; font-size: 1.1rem;
      padding: .8rem 1.6rem; border-radius: 999px;
    }
    a.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    nav { margin-top: 1.25rem; font-size: .95rem; }
    nav a { color: var(--leaf); }
  </style>
